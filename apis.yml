aid: xproapi

name: Xproapi

description: Xproapi provides a developer API that monitors X (formerly Twitter) accounts, tracking who they follow and who follows them. It offers
  daily checks, alerts via Telegram, Discord, or email, and delivers follower/following data through a RESTful API. The service includes pricing
  tiers, a blog with updates, and clear terms and privacy policies.

